<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spoti.pw — AltStore source</title>
<meta name="description" content="Add the spoti.pw AltStore source to install and update the Liquid Glass Spotify mod.">
<style>
  :root { color-scheme: dark; --tint: #1ED760; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(circle at 20% 0%, #14321f 0%, #0a0a0a 55%);
    color: #f5f5f7; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 128px; height: 128px; border-radius: 22px; margin: 0 auto 18px; display: block;
          box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -.02em; }
  p.sub { color: #a1a1a6; margin: 0 0 28px; }
  a.btn {
    display: block; padding: 15px 20px; margin: 12px 0; border-radius: 14px; font-weight: 600;
    text-decoration: none; color: #04150a; background: var(--tint); transition: transform .12s ease, filter .12s ease;
  }
  a.btn.secondary { color: #f5f5f7; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); }
  a.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .links { margin-top: 26px; font-size: .85rem; color: #86868b; }
  .links a { color: #a1a1a6; text-decoration: none; margin: 0 8px; }
  .links a:hover { color: #f5f5f7; }
  code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="">
  <h1>spoti.pw</h1>
  <p class="sub">Spotify, in glass. Add this source to install and update it.</p>

  <a class="btn" id="altstore" href="#">Add to AltStore</a>
  <a class="btn secondary" id="sidestore" href="#">Add to SideStore</a>

  <p class="links">
    <a href="source.json">source.json</a>
    <a href="https://spoti.pw">Website</a>
    <a href="https://github.com/skopevoj/spoti.pw">GitHub</a>
  </p>
</main>
<script>
  // Build the deep links from wherever this page is served, so the source URL
  // follows the deployment domain with nothing hard-coded.
  var source = new URL('source.json', location.href).href;
  document.getElementById('altstore').href = 'altstore://source?url=' + encodeURIComponent(source);
  document.getElementById('sidestore').href = 'sidestore://source?url=' + encodeURIComponent(source);
</script>
</body>
</html>
