# Publishes the AltStore / SideStore source for a release.
#
# .github/workflows/release.yml calls this as a reusable workflow from the job that runs when Release
# Please has cut a release, and that is why it is not simply triggered by `release: published`: a
# workflow's GITHUB_TOKEN does not start other workflows, and Release Please creates the release with
# GITHUB_TOKEN, so that trigger alone would never fire. The trigger is kept for a release published
# by hand (which GITHUB_TOKEN is not behind), and workflow_dispatch republishes a version.
#
# Given the release, it builds the same IPA the .deb comes from and:
#
#   1. stamps the release into its CFBundleVersion, which is the only thing that changes between
#      releases (Spotify's own version and build number never do, so without this AltStore would
#      never see an update) -- scripts/altstore-ipa.py
#   2. attaches that IPA to the release, next to the .deb, which is where AltStore downloads it from
#   3. reads the IPA's identity (version, build version, sha256, entitlements, privacy strings) and
#      writes altstore/site/source.json from it with the official release notes
#      -- scripts/altstore-source.py
#   4. commits source.json to main, which is what deploys the site: Vercel builds altstore/site on
#      every push. The source is committed, not published behind Vercel's back, so the repository is
#      the whole state of it.
#
# The IPA is a release asset because that is the only public place it fits: it is over GitHub's
# 100 MB per-file limit, it would sit in this repository's history forever, and a Vercel Hobby
# deployment (100 MB) is too small to carry it. Release assets are downloadable without a token, so
# this needs no other host -- but only while this repository is public: a private repository's
# assets demand authentication, and AltStore sends none.
#
# The IPA is unsigned: AltStore re-signs it on install with the user's own certificate.
name: AltStore source

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "The release to publish into, e.g. v0.23.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to publish into (defaults to v<version.txt>)"
        required: false
        type: string
      ref:
        description: "What to build (defaults to the tag's tree); pass main to build a tree that has no tag yet"
        required: false
        type: string
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (defaults to the SPOTIFY_IPA_URL secret)"
        required: false
        type: string
      mod_version:
        description: "Mod version to publish (defaults to version.txt at the checked-out ref)"
        required: false
        type: string

permissions:
  contents: write

# Two publishes would race for the same release asset and the same source.json.
concurrency:
  group: altstore-source
  cancel-in-progress: false

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  publish:
    runs-on: macos-latest
    steps:
      # The checkout below dies on a tag that does not exist with a bare git error, which is a
      # confusing way to learn the release is not there; say so first. Empty unless a dispatch named
      # one: a release event and release.yml both point at a release that exists.
      - name: The tag has to be a tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "no tag named; the triggering release names its own"; exit 0; }
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" > /dev/null || {
            echo "::error::$TAG is not a tag in this repository. The source is built from a release tag, and the IPA is attached to its release: tag a version (v0.22.0) or run a release first."; exit 1; }

      # The release's tag is the commit Release Please wrote version.txt into. ref overrides what is
      # built, for publishing a version whose tag predates the tooling in this workflow: tag v0.22.0
      # names the release, ref main says build what main holds.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      # Same secret release.yml builds the .deb with, so both artifacts come from the same flag
      # table. It is optional here: the IPA is in hand, so the pipeline can extract it itself.
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            echo "::warning::SG_FLAG_LIST is not set; the pipeline will extract the flag table from the IPA"
          fi

      - name: Download IPA
        env:
          SECRET_IPA_URL: ${{ secrets.SPOTIFY_IPA_URL }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          url="${INPUT_IPA_URL:-$SECRET_IPA_URL}"
          [ -n "$url" ] || { echo "::error::no decrypted IPA: set the SPOTIFY_IPA_URL secret or pass ipa_url"; exit 1; }
          mkdir -p ipa
          curl -fsSL "$url" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - name: Resolve the version and the release it is published into
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.mod_version }}
        run: |
          version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(cat version.txt)"
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="$EVENT_TAG"
          [ -n "$tag" ] || tag="v$version"
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp the release's build number and read the IPA's identity
        id: identity
        run: |
          IPA="$(ls out/*.ipa | head -1)"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          # --stamp-release rewrites CFBundleVersion in the app and every extension *before* the
          # identity is read, so the sha256 and size below belong to the bytes that get uploaded.
          python3 scripts/altstore-ipa.py "$IPA" --stamp-release "${{ steps.release.outputs.mod_version }}" > identity.json
          python3 scripts/altstore-ipa.py "$IPA" --summary

      - name: Attach the IPA to the release
        id: ipa
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          asset="spoti.pw-${{ steps.release.outputs.mod_version }}.ipa"
          # A release event and release.yml both hand us a release that is already there. A dispatch
          # may name a tag whose release was never cut -- then this is where it gets one, which is why
          # the asset goes up before source.json is written: the entry has to point at something real.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag \
              --title "spoti.pw ${{ steps.release.outputs.mod_version }}" \
              --notes "Built from \`$TAG\`. The mod's own release notes are at https://github.com/skopevoj/spoti.pw/releases/tag/$TAG." \
              --repo "$GITHUB_REPOSITORY"
          cp "${{ steps.identity.outputs.ipa }}" "$asset"
          gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### spoti.pw ${{ steps.release.outputs.mod_version }}"
            echo
            echo "IPA: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Read back from the checkout, not from the deployed site: what was committed is the history
      # the next release keeps.
      - name: Write source.json
        env:
          BASE_URL: ${{ vars.ALTSTORE_BASE_URL }}
        run: |
          python3 scripts/altstore-source.py identity.json \
            --download-url "${{ steps.ipa.outputs.url }}" \
            --mod-version "${{ steps.release.outputs.mod_version }}" \
            --base-url "$BASE_URL" \
            --previous altstore/site/source.json

      - name: Commit source.json
        run: |
          # --ignored: an older tag still ignores source.json, so "no changes" and "not added yet"
          # have to be told apart there too.
          if [ -z "$(git status --porcelain --ignored -- altstore/site/source.json)" ]; then
            echo "source.json is unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f altstore/site/source.json
          # A chore, so Release Please leaves the release alone. Vercel does not read [skip ci]: it
          # builds this push, which is the deploy. (A push made with GITHUB_TOKEN starts no workflow
          # of its own, Release Please's included, so the marker is belt and braces.)
          git commit -m "chore(altstore): source.json for ${{ steps.release.outputs.mod_version }} [skip ci]"
          # The tag this checked out is a commit on main, but main may have moved on since.
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
